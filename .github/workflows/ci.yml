name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    name: Python validation tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: Validate representative fixture through CLI
        run: semi-ai validate examples/synthetic_data/run_warning_alarm_001.json
